name: Tag Release

# Builds a GitHub Release (fat jar + sources jar) whenever a v* tag is pushed,
# or when dispatched with an existing tag (this is how the "Bump version and
# release" workflow kicks it off, since a tag pushed with the automatic
# GITHUB_TOKEN can't trigger the push event below).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.1.3)'
        required: true
        type: string

permissions:
  contents: write   # needed to create the release and upload assets
  packages: write   # mvn deploy to this repo's GitHub Packages Maven registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a tag push this is the tag ref; on a dispatched run it's the
          # tag supplied as an input.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Baseline is JDK 25 LTS (the Windows backend uses FFM, final in JDK 22).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure Maven auth for GitHub Packages
        # Replaces the runner's settings.xml with the two server entries any
        # build here may need: `github` publishes this repo's own packages
        # (the workflow's GITHUB_TOKEN can write those), and `github-hooji`
        # reads packages of other hooji repositories (needs the
        # CROSS_REPO_TOKEN PAT — GITHUB_TOKEN cannot see other private
        # repos). Passwords resolve from the environment when mvn runs;
        # no secret is ever written to disk.
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-hooji</id>
                <username>hooji</username>
                <password>${env.PACKAGES_READ_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Resolve tag and version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (version ${TAG#v})"

      - name: Build and publish to GitHub Packages
        # The release version comes entirely from the tag via the CI-friendly
        # -Drevision override; no POM mutation needed (flatten-maven-plugin
        # resolves ${revision} in the deployed POM). `deploy` additionally
        # uploads the fat jar + sources jar + POM to this repo's GitHub
        # Packages Maven registry (see <distributionManagement> in pom.xml)
        # as com.u1.servicepal:servicepal.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -Drevision=${{ steps.ver.outputs.version }} -DskipTests deploy

      - name: Stage release artifacts
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p release
          cp target/servicepal.jar "release/servicepal-${V}.jar"
          cp target/servicepal-sources.jar "release/servicepal-${V}-sources.jar"
          ls -l release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          TAG=${{ steps.ver.outputs.tag }}
          gh release create "${TAG}" \
            "release/servicepal-${V}.jar" \
            "release/servicepal-${V}-sources.jar" \
            --title "${TAG}" \
            --notes "Automated release ${TAG}.

          Assets:
          - \`servicepal-${V}.jar\` — runnable fat jar (library + discovery CLI + dd-plist). Run: \`java -jar servicepal-${V}.jar\`.
          - \`servicepal-${V}-sources.jar\` — library sources (for IDE attachment)."

      - name: Prune old package versions
        # GitHub Packages bills PRIVATE-repo storage (hourly, against the
        # plan's quota). The GitHub Release — whose asset storage is free —
        # is the permanent archive of every version, and any tag rebuilds
        # the same artifacts, so the Maven registry only keeps the very
        # newest release of each package; older versions are deleted here
        # after every successful release.
        #
        # Consequence, accepted by design: only the very newest release
        # resolves from the registry — a consumer pinning anything older
        # gets a resolution failure (historical jars stay on the Releases
        # page).
        #
        # KEEP >= 1 always, which also avoids the API's refusal to delete
        # a package's last remaining version. Uses the workflow's own
        # GITHUB_TOKEN (packages: write): it may delete versions of
        # packages scoped to this repository. Best-effort throughout: a
        # prune failure must never fail a release. per_page=100 with no
        # pagination is deliberate — pruning runs every release, so the
        # backlog can never grow past one page.
        # CHANGE WHEN CLONING: the Maven package names in PACKAGES
        # (<groupId>.<artifactId>, one per deployed module).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          KEEP: "1"
          PACKAGES: >-
            com.u1.servicepal.servicepal
        run: |
          set -euo pipefail
          for pkg in ${PACKAGES}; do
            ids="$(gh api "/users/${OWNER}/packages/maven/${pkg}/versions?per_page=100" \
                     --jq 'sort_by(.created_at) | reverse | .['"${KEEP}"':] | .[].id' 2>/dev/null || true)"
            if [ -z "${ids}" ]; then
              echo "${pkg}: nothing to prune"
              continue
            fi
            for id in ${ids}; do
              if gh api -X DELETE "/users/${OWNER}/packages/maven/${pkg}/versions/${id}" >/dev/null 2>&1; then
                echo "pruned: ${pkg} version id ${id}"
              else
                echo "::warning::could not prune ${pkg} version id ${id} — continuing"
              fi
            done
          done
